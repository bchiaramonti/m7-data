# =============================================================================
# Schema: Normativo M7 (sidecar YAML)
# =============================================================================
# Cada documento normativo da M7 (POL/MAN/INS/ESP) tem:
#   - 1 arquivo HTML autocontido em  01-fundacao-2.1/artefatos/
#       (estrutura EXATAMENTE como o template oficial)
#   - 1 arquivo YAML no catálogo em  01-fundacao-2.1/normativos/catalogo/
#       (nome canônico = {CODE}.yaml; vínculo ao HTML via links.artifact_html)
#
# Exemplo:
#   artefatos/politica-m7-investimentos.html
#   normativos/catalogo/POL-GOV-002.yaml          ← aponta para o HTML acima
#   normativos/catalogo/manifest.json             ← lista todos os YAMLs
#
# Quem consome:
#   1. O Cockpit de Normativos lê o manifest e todos os YAMLs e monta
#      a matriz, lista, hierarquia e cadeia — sem nunca abrir o HTML.
#   2. A skill que gera o documento usa o YAML como FONTE DE VERDADE
#      dos metadados: cada um dos ~10 pontos do HTML onde o mesmo dado
#      aparece (código, versão, owner, datas) é preenchido a partir
#      do mesmo campo do YAML — eliminando dessincronia.
#
# Convenção do schema:
#   - "required: true"      → obrigatório sempre
#   - "required_when:"      → obrigatório só em alguns status
#   - "controlled: <enum>"  → vocabulário fechado, validar contra enum
#   - "html_anchors: [...]" → lista os pontos do HTML onde a skill DEVE
#     espelhar este valor (vide skill-handoff-yaml-sidecar.md §3)
# =============================================================================

$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Normativo M7 — sidecar YAML"
type: object
required:
  - schema_version
  - identity
  - lifecycle
  - governance
  - presentation

properties:

  # ---------------------------------------------------------------------------
  # schema_version
  # ---------------------------------------------------------------------------
  # Permite evoluir o schema sem quebrar leitores antigos. Bump SemVer quando
  # campos obrigatórios mudarem.
  schema_version:
    type: string
    const: "1.0"
    description: "Versão do schema deste YAML (não confundir com versão do documento)."

  # ===========================================================================
  # 1. IDENTITY — código canônico, tipo, área, status
  # ===========================================================================
  identity:
    type: object
    required: [code, tipo, area, version, status, pages, classif]
    properties:

      code:
        type: string
        pattern: "^(POL|MAN|INS|ESP)-[A-Z]{2,4}-[0-9]{3}$"
        description: |
          Código canônico do documento. Formato: TIPO-AREA-NNN.
          Aparece em ~10 pontos do HTML — todos preenchidos a partir daqui.
        html_anchors:
          - "title.head"                         # <title> da janela
          - "shell.meta.codigo"                  # span no header
          - "side-meta.codigo"                   # sidebar
          - "cover.eyebrow.codigo"               # cover-eyebrow .v
          - "cover.foot.codigo"                  # cover-foot
          - "page-head.ph-meta"                  # ph-meta de cada página
          - "controle.kv-table.codigo"           # kv-table linha "Código"

      tipo:
        type: string
        controlled: [POL, MAN, INS, ESP]
        description: "Sigla do tipo. POL=Política, MAN=Manual, INS=Instrução, ESP=Especificação Técnica."

      tipo_label:
        type: string
        description: |
          Versão extensa do tipo, como aparece no shell e nas tabs.
          Derivado de tipo (POL→Política, MAN→Manual, INS→Instrução, ESP→Especificação Técnica)
          mas explicitado no YAML para auditoria e i18n futura.
        examples: ["Política", "Manual", "Instrução", "Especificação Técnica"]

      area:
        type: string
        controlled: [GOV, PERF, INV, CRE, SEG, UNI, TEC, PES]
        description: |
          Sigla da área funcional (segundo bloco do code). Vide M7DATA.AREAS
          no cockpit. Para documentos institucionais da holding, use GOV +
          `governance.escopo: holding` — não existe código separado "M7" na
          área (o cockpit usa "M7" só internamente como célula-destino da
          lane Holding na Matriz). O code pattern `[A-Z]{2,4}` exige letras
          puras, então "M7" (com dígito) nunca foi um valor válido.

      area_label:
        type: string
        description: "Versão legível da área (ex.: GOV→Governança)."

      version:
        type: string
        pattern: "^v?[0-9]+\\.[0-9]+$"
        description: "Versão SemVer reduzida do documento (NÃO do schema). Ex.: v1.0, 1.2, 0.3."

      version_label:
        type: string
        description: |
          Versão como aparece no HTML para humano (com data opcional).
          Ex.: "v1.0 · Mai / 2026".
        html_anchors:
          - "shell.strip.versao"
          - "side-meta.versao"
          - "cover.grid.versao"
          - "controle.kv-table.versao"

      status:
        type: string
        controlled: [vigente, revisao, rascunho, pendente, vencido]
        description: |
          Estado do ciclo de vida do documento.
          - vigente:  aprovado e em vigor
          - revisao:  revisão periódica em andamento
          - rascunho: em elaboração
          - pendente: previsto pela hierarquia, ainda não iniciado
          - vencido:  fora do prazo de revisão obrigatória

      pages:
        type: integer
        minimum: 0
        description: |
          Total de páginas A4 do documento renderizado.
          Pode ser 0 para status=rascunho/pendente sem HTML produzido.
        html_anchors:
          - "shell.strip.paginas"
          - "page-foot.total-pg"

      classif:
        type: string
        controlled: [Público, Interno, Confidencial, Restrito]
        description: "Classificação de confidencialidade."

      classif_label:
        type: string
        description: |
          Frase exibida no rodapé de cada página.
          Ex.: "Uso interno · Confidencial".
        html_anchors:
          - "cover.foot.classif"
          - "page-foot.classif"

  # ===========================================================================
  # 2. LIFECYCLE — datas e cadência
  # ===========================================================================
  lifecycle:
    type: object
    required: [date, nextReview, revisaoFreq]
    properties:

      date:
        type: string
        format: date
        description: |
          Data de início de vigência (ISO 8601: YYYY-MM-DD).
          A skill formata para dd/mm/yyyy ao renderizar.
        required_when: ["vigente", "revisao", "vencido"]

      date_label:
        type: string
        description: |
          Versão formatada como aparece no HTML. Ex.: "18/05/2026".
          Variante curta (18/05/26) é derivada por slice.
        html_anchors:
          - "shell.meta.data"
          - "shell.strip.vigencia"
          - "cover.grid.vigencia"
          - "controle.kv-table.data"

      nextReview:
        type: string
        format: date
        description: "Data da próxima revisão obrigatória (ISO 8601)."
        required_when: ["vigente", "revisao", "vencido"]

      nextReview_label:
        type: string
        description: "Próx. revisão como aparece no HTML. Ex.: 18/05/2027."
        html_anchors:
          - "side-meta.proxRevisao"
          - "shell.strip.proxRevisao"
          - "cover.grid.proxRevisao"

      revisaoFreq:
        type: string
        controlled: [Anual, Semestral, Trimestral, Mensal, "Sob demanda"]
        description: |
          Frequência de revisão obrigatória deste tipo de documento.
          Derivado de tipo (POL→Anual, MAN→Semestral, INS→Trimestral, ESP→Trimestral)
          mas explicitado no YAML porque pode ter exceções.
        html_anchors:
          - "controle.kv-table.revisao"

  # ===========================================================================
  # 3. GOVERNANCE — papéis, hierarquia e processos cobertos
  # ===========================================================================
  governance:
    type: object
    required: [owner, parent, processos, escopo]
    properties:

      escopo:
        type: string
        controlled: [holding, transversal, processo]
        description: |
          Onde este documento se posiciona na arquitetura M7:

          - holding:     rege a Holding M7 inteira (políticas-mãe, manuais
                         da holding). Renderiza na lane "Holding M7" da
                         Matriz — uma única célula, não 12 réplicas
                         (mesmo que `processos` liste P1..P12).
                         Ex.: POL-GOV-001, POL-GOV-002.

          - transversal: cobre múltiplos processos, mas não a holding inteira.
                         Renderiza em CADA processo do array `processos`.
                         Ex.: uma INS que vale para P1 e P12, ou um MAN
                         que cobre P3+P4+P5.

          - processo:    pertence a um processo específico. Renderiza só
                         na célula daquele processo.
                         Ex.: MAN-CRE-001 (Crédito), INS-INV-001 (Investimentos).

          Auto-derivação quando ausente:
            - 0 ou 1 processo → "processo"
            - múltiplos       → "transversal"
            - "holding" NUNCA é auto-derivado, sempre explícito.

      owner:
        type: string
        description: |
          Área/papel custodiante do documento (forma curta para o header).
          Ex.: "Estratégia & Governança", "Head de Desempenho".
        html_anchors:
          - "side-meta.owner"
          - "cover.grid.responsavel"

      elaboradoPor:
        type: string
        description: |
          Quem elaborou (nome + cargo + empresa).
          Ex.: "Bruno Chiaramonti · Head de Desempenho · M7 Investimentos".
          A skill renderiza o nome em <strong>.
        html_anchors:
          - "controle.kv-table.elaboradoPor"

      aprovadoPor:
        type: string
        description: |
          Quem aprova (papel + empresa).
          Ex.: "Diretoria Executiva · M7 Investimentos".
        html_anchors:
          - "controle.kv-table.aprovadoPor"
          - "page-aprovacao.aprovador.who"

      aprovador_role:
        type: string
        description: |
          Aprovador formal segundo a hierarquia normativa M7 (POL→Diretoria,
          MAN→Head de área, INS→Líder do processo, ESP→Analista responsável).
          Pode coincidir com aprovadoPor.
        examples: ["Diretoria", "Head de área", "Líder", "Analista"]

      revisor:
        type: string
        description: "Instância de revisão. Ex.: Comitê de Processos."
        html_anchors:
          - "page-aprovacao.revisor.who"

      parent:
        oneOf:
          - type: "null"
          - type: object
            required: [code]
            properties:
              code:
                type: string
                pattern: "^(POL|MAN|INS|ESP)-[A-Z]{2,4}-[0-9]{3}$"
              title:
                type: string
                description: "Título do documento superior, para a célula 'Documento superior' na kv-table."
        description: |
          Documento superior na hierarquia normativa.
          null para POL-GOV-001 (única política mãe).
        html_anchors:
          - "controle.kv-table.docSuperior"

      processos:
        type: array
        items:
          type: string
          pattern: "^(G[1-4]|P[1-9]|P1[0-2]|A[1-5])$"
        description: |
          Códigos dos processos macro cobertos pelo documento.
          Vide M7DATA.PROCESSOS no cockpit.

  # ===========================================================================
  # 4. PRESENTATION — títulos, leads e textos exibidos
  # ===========================================================================
  presentation:
    type: object
    required: [title_short, title_full, subtitle, lede]
    properties:

      title_short:
        type: string
        description: |
          Título curto, capitalização "Title Case", usado em todos os
          ph-meta (cabeçalho das páginas internas) e na kv-table.
          Ex.: "Política Geral de Governança Corporativa".
        html_anchors:
          - "page-head.ph-title"

      title_full:
        type: object
        required: [parts]
        properties:
          parts:
            type: array
            items:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                accent:
                  type: boolean
                  default: false
                  description: |
                    Quando true, renderiza com <span class="accent"> no shell e
                    <em> na cover-title. Marca a parte do título em destaque
                    visual (cor lime).
                break_before:
                  type: boolean
                  default: false
                  description: |
                    Quando true, insere <br> ANTES desta parte na cover-title
                    (não afeta o shell, que é single-line). Útil pra quebrar
                    títulos longos visualmente.
        description: |
          Título completo decomposto em segmentos, com marca de destaque (accent)
          opcional. A skill compõe:
            - Shell: <h1>{partes concatenadas com <span class="accent">…</span> nas accent=true}</h1>
            - Cover: <h1 class="cover-title">{partes concatenadas, accent=true vira <em>, break_before=true vira <br>}</h1>
        examples:
          - parts:
              - text: "Política "
              - text: "geral de governança"
                accent: true
              - text: " corporativa"

      subtitle:
        type: string
        description: |
          Texto longo da cover-subtitle (sob o cover-title).
          Tipicamente 1-2 frases, define o que o documento estabelece.
        html_anchors:
          - "cover.subtitle"

      lede:
        type: string
        description: |
          Texto curto exibido no shell header (sob o título), 1 frase.
          Costuma iniciar com "Documento normativo {code}." e completar com o propósito.
        html_anchors:
          - "shell.lede"

      eyebrow_categoria:
        type: string
        description: |
          Categoria narrativa exibida no cover-eyebrow antes do código.
          Ex.: "Documento de governança", "Manual operacional", "Instrução técnica".
          Se omitido, a skill deriva de tipo (POL→Documento de governança, MAN→Manual operacional…).
        html_anchors:
          - "cover.eyebrow.categoria"

      page_label_section:
        type: string
        description: |
          Bloco de área exibido no shell.meta (primeiro span) e no cover-head.
          Ex.: "Governança". Derivável de area mas explicitado para casos
          em que o documento cruza áreas.
        html_anchors:
          - "shell.meta.area"
          - "cover.head.area"

  # ===========================================================================
  # 5. STRUCTURE — sumário lateral (TOC do shell)
  # ===========================================================================
  # A lista de páginas é o que aparece na .side-toc do shell. A skill gera
  # o sumário lateral A PARTIR destas entradas, e gera o sumário formal
  # (página 2) a partir das seções marcadas como "section: true".
  structure:
    type: object
    properties:

      toc:
        type: array
        description: |
          Lista de páginas A4 do documento, na ordem de aparição.
          A primeira entrada é sempre 'Capa', a segunda 'Controle & sumário'.
        items:
          type: object
          required: [page, label]
          properties:
            page:
              type: integer
              minimum: 1
              description: "Número da página (1-based)."
            label:
              type: string
              description: "Rótulo exibido no sumário lateral."
            section:
              type: string
              description: |
                Quando preenchido, esta página inicia uma seção numerada
                do documento (1, 2, 3, …) e entra no sumário formal da p.2.
                Ex.: "1. Objetivo", "5. Diretrizes".
            subsection:
              type: boolean
              default: false
              description: "Quando true, é sub-item da seção corrente (estilo h2 no sumário)."

  # ===========================================================================
  # 6. LINKS — vínculos com outros artefatos do projeto
  # ===========================================================================
  links:
    type: object
    properties:

      artifact_html:
        type: string
        description: |
          Caminho relativo (a partir do próprio YAML) do HTML autocontido.
          Como os YAMLs vivem em normativos/catalogo/ e os HTMLs em
          01-fundacao-2.1/artefatos/, o caminho típico é:
            "../../artefatos/{slug-humano}.html"
          O cockpit resolve via `new URL(artifact_html, yamlUrl)` e abre
          em iframe quando o usuário clica "Abrir documento".

      siblings:
        type: array
        description: |
          Outros artefatos do mesmo projeto/processo, exibidos como tabs no
          shell header do HTML autocontido (cadeia, missão, mapa…).
          A skill renderiza cada um como <a class="tab" href="{href}">.
        items:
          type: object
          required: [label, href]
          properties:
            label:
              type: string
              description: "Texto da tab."
            badge:
              type: string
              description: "Pequeno selo monoespaçado (ex.: N1, DOC)."
            href:
              type: string
              description: "Caminho relativo do HTML do artefato irmão."
            active:
              type: boolean
              default: false
              description: "true para a tab do próprio documento."

      parent_doc_url:
        type: string
        description: |
          (Opcional) URL/caminho do documento superior (parent.code), usado
          pelo cockpit ao mostrar a árvore de relacionamentos.

# =============================================================================
# Convenções e regras invariantes (NÃO RELAXAR)
# =============================================================================
#
# I.   Datas: armazenar em ISO 8601 (YYYY-MM-DD) e expor o *_label como
#      string em pt-BR (DD/MM/YYYY). Nenhuma data fica "solta" em string
#      ambígua. A skill faz a formatação no HTML.
#
# II.  O HTML é a representação humana; o YAML é a representação canônica
#      para máquina. EM CASO DE CONFLITO entre HTML e YAML, vence o YAML
#      — a skill deve regenerar o HTML, não editar o YAML para combinar.
#
# III. A estrutura do HTML (ordem de páginas, classes CSS, anatomia das
#      seções "Controle", "Objetivo", "Escopo", "Definições", "Princípios",
#      "Diretrizes", "Papéis", "Governança", "Disposições finais") é
#      INVARIANTE — definida pelo template oficial M7 e replicada
#      EXATAMENTE pela skill. O YAML não controla forma; controla apenas
#      conteúdo de identidade.
#
# IV.  Cada normativo = 1 par {.html em artefatos/, .yaml em catalogo/}.
#      O vínculo é via links.artifact_html (e não via basename compartilhado,
#      porque os arquivos vivem em pastas diferentes). Sem entrada no
#      manifest.json + YAML correspondente, o documento não aparece no
#      cockpit. Sem links.artifact_html (ou HTML inexistente), o cockpit
#      mostra o card mas desativa "Abrir documento".
#
# V.   Convenção de caminhos relativos:
#        - manifest.json → entries[].path:  relativo ao próprio manifest
#          (manifest e YAMLs vivem em catalogo/, então só o nome)
#        - YAML → links.artifact_html:      relativo ao próprio YAML
#          (típico: "../../artefatos/{slug}.html")
#        - YAML → links.siblings[].href:    relativo ao HTML do normativo
#          (típico: outros HTMLs no mesmo diretório artefatos/)
#      Nunca usar caminhos absolutos ou URLs OneDrive — quebrarão fora do
#      contexto do projeto.
